<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lumaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background charcoal badge -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#0d0d12" stroke="#262633" stroke-width="2" />
  
  <!-- Outer Aperture Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#lumaGold)" stroke-width="2.5" opacity="0.4" />
  
  <!-- Architectural Light Ray Blades -->
  <path d="M50 16 L53 36 L47 36 Z" fill="url(#lumaGold)" filter="url(#softGlow)" />
  <path d="M50 84 L53 64 L47 64 Z" fill="url(#lumaGold)" filter="url(#softGlow)" />
  <path d="M16 50 L36 53 L36 47 Z" fill="url(#lumaGold)" filter="url(#softGlow)" />
  <path d="M84 50 L64 53 L64 47 Z" fill="url(#lumaGold)" filter="url(#softGlow)" />
  
  <!-- Inner Illuminating Core -->
  <circle cx="50" cy="50" r="14" fill="#14141c" stroke="url(#lumaGold)" stroke-width="2" />
  <circle cx="50" cy="50" r="7" fill="url(#lumaGold)" filter="url(#softGlow)" />
</svg>
